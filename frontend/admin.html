<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Scientific Portal</title>
    <link rel="stylesheet" href="style.css"> <!-- reuse your signup/login/search CSS -->
    <style>
        body {
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #000000, #0f52ba);
            color: #00ffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            text-shadow: 0 0 12px #00ffff;
        }

        h2 {
            margin-bottom: 30px;
            font-size: 20px;
            color: #fff;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            background: #0f52ba;
            color: #fff;
            transition: 0.3s ease;
            margin-bottom: 20px;
        }

        button:hover {
            background: #00ffff;
            color: #000;
            transform: scale(1.05);
        }

        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        th,
        td {
            border: 1px solid #0f52ba;
            padding: 12px;
            text-align: left;
            color: #fff;
        }

        th {
            background: #0f52ba;
            color: #fff;
            font-weight: bold;
        }

        tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body>
    <h1>🔬 Scientific Portal</h1>
    <h2>📊 Admin Dashboard</h2>
    <button id="loadUsers">Load User Details</button>

    <table id="usersTable">
        <thead>
            <tr>
                <th>Username</th>
                <th>Email</th>
                <th>Password</th>
                <th>Search Term</th>
                <th>Explanation</th>
                <th>Timestamp</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        document.getElementById("loadUsers").addEventListener("click", async () => {
            try {
                const response = await fetch("http://localhost:5000/admin/users");
                const data = await response.json();

                const tbody = document.querySelector("#usersTable tbody");
                tbody.innerHTML = "";

                data.forEach(item => {
                    const row = `
            <tr>
              <td>${item.username || "N/A"}</td>
              <td>${item.email || "N/A"}</td>
              <td>${item.password || "N/A"}</td>
              <td>${item.query}</td>
              <td>${item.response}</td>
              <td>${new Date(item.timestamp).toLocaleString()}</td>
            </tr>
          `;
                    tbody.innerHTML += row;
                });
            } catch (err) {
                console.error("Error loading users:", err);
                alert("Failed to load user details");
            }
        });
    </script>
</body>

</html>
