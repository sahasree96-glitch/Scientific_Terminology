<!DOCTYPE html>
<html>

<head>
    <title>Home - Scientific Portal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    </div>
    <script src="js/search.js"></script>

    <script src="script.js"></script>
</body>

</html>
